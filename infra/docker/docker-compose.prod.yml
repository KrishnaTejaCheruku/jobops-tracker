name: jobops-tracker-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobops}
      POSTGRES_USER: ${POSTGRES_USER:-jobops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - jobops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jobops-net

  backend:
    image: jobops-tracker-backend:${APP_VERSION:-0.2.0}
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: jobops-tracker
      APP_ENV: production
      SERVER_PORT: 8000
      DATABASE_URL: postgres://${POSTGRES_USER:-jobops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jobops}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - jobops-net

  frontend:
    image: jobops-tracker-frontend:${APP_VERSION:-0.2.0}
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - jobops-net

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      JOBOPS_SITE_ADDRESS: ${JOBOPS_SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - jobops-net

volumes:
  jobops_postgres_data:
  caddy_data:
  caddy_config:

networks:
  jobops-net:
    driver: bridge

name: jobops-tracker-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobops}
      POSTGRES_USER: ${POSTGRES_USER:-jobops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - jobops_postgres_data:/var/lib/postgresql/data
    networks:
      - jobops-net
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    image: jobops-tracker-backend:${APP_VERSION:-latest}
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: jobops-tracker
      APP_ENV: production
      GIN_MODE: release
      SERVER_PORT: "8000"
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      OTP_DELIVERY_MODE: ${OTP_DELIVERY_MODE:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-JobOps Tracker}
      DATABASE_URL: postgres://${POSTGRES_USER:-jobops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jobops}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobops-net
    expose:
      - "8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    image: jobops-tracker-frontend:${APP_VERSION:-latest}
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    depends_on:
      - backend
    networks:
      - jobops-net
    expose:
      - "80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2.8-alpine
    environment:
      JOBOPS_SITE_ADDRESS: ${JOBOPS_SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - frontend
      - backend
    networks:
      - jobops-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  jobops-net:
    driver: bridge

volumes:
  jobops_postgres_data:
  caddy_data:
  caddy_config:
  caddy_logs:

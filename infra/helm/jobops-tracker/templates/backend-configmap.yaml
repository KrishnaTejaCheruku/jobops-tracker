apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jobops-tracker.backendConfigName" . }}
  labels:
    {{- include "jobops-tracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  APP_NAME: {{ .Values.backend.env.appName | quote }}
  APP_ENV: {{ .Values.backend.env.appEnv | quote }}
  SERVER_PORT: {{ .Values.backend.env.serverPort | quote }}

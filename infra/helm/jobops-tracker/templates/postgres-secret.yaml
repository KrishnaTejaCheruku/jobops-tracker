apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jobops-tracker.postgresSecretName" . }}
  labels:
    {{- include "jobops-tracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:%d/%s?sslmode=disable" .Values.postgres.auth.username .Values.postgres.auth.password (include "jobops-tracker.postgresName" .) (.Values.postgres.service.port | int) .Values.postgres.auth.database | quote }}

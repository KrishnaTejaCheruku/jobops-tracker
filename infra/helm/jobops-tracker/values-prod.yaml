backend:
  replicaCount: 1
  image:
    repository: ghcr.io/krishnatejacheruku/jobops-tracker-backend
    tag: "v0.5.0-ci-cd"
    pullPolicy: IfNotPresent
  env:
    appEnv: production

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/krishnatejacheruku/jobops-tracker-frontend
    tag: "v0.5.0-ci-cd"
    pullPolicy: IfNotPresent

postgres:
  auth:
    database: jobops
    username: jobops
    password: change-this-before-production
  persistence:
    enabled: true
    size: 5Gi

migrations:
  enabled: true

apiVersion: v1
kind: Secret
metadata:
  name: jobops-postgres-secret
  namespace: jobops-tracker
type: Opaque
stringData:
  POSTGRES_DB: jobops
  POSTGRES_USER: jobops
  POSTGRES_PASSWORD: jobops-local-password
  DATABASE_URL: postgres://jobops:jobops-local-password@postgres:5432/jobops?sslmode=disable

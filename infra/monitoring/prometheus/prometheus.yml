global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: jobops-backend-local
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000

  - job_name: jobops-backend-production
    metrics_path: /api/metrics
    scheme: https
    static_configs:
      - targets:
          - jobops.me
